name: Share a project
description: Something that was made here. Show others what is possible and how you did it.
title: "Add project: "
labels:
  - submission
  - project
body:
  - type: markdown
    attributes:
      value: Thank you for helping! Fill in what you know — only the fields marked with a red star are required. After you submit, a draft page is prepared automatically and a maintainer checks it before it goes live.
  - type: input
    id: name
    attributes:
      label: Name of the project
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: What is it, in one or two sentences?
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Who made it?
      description: Names as they should appear on the site.
  - type: input
    id: year
    attributes:
      label: Year
      placeholder: e.g. 2025
  - type: input
    id: equipment
    attributes:
      label: Which machines did you use?
  - type: input
    id: spaces
    attributes:
      label: Where was it made?
  - type: input
    id: skills
    attributes:
      label: Which skills did it take?
      description: "Separate several with commas, for example: 3D printing, Electronics"
  - type: input
    id: link
    attributes:
      label: Link to more (repository, report, video)
      placeholder: https://
  - type: textarea
    id: details
    attributes:
      label: Anything else worth knowing
      description: How you made it, step by step if you like. What would you do differently?
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag one photo that you made yourself (or may share) into this box. Avoid recognisable people unless they agree.
      placeholder: Drag a photo here.
  - type: input
    id: submitter
    attributes:
      label: Your name or e-mail (optional)
      description: Only used if we have a question about your submission. It is visible to others on GitHub, so leave it empty if you prefer.
