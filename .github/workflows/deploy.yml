# Publishes the site to GitHub Pages every time something lands on `main`.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Find out where the site lives
        id: pages
        uses: actions/configure-pages@v6
      - name: Check and build
        run: |
          npm run check
          npm test
          npm run build
        env:
          # The address is taken from the repository's Pages settings, so a
          # renamed repository or a custom domain needs no change here.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
